<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="stwytid - kişisel tanıtım sayfası">
  <title>stwytid</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #e2e8f0;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      text-align: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 40px 28px;
      backdrop-filter: blur(8px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 700;
      margin: 0 auto 20px;
      color: white;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
    }
    h1 { font-size: 26px; font-weight: 700; }
    .tagline { color: #94a3b8; margin: 8px 0 28px; font-size: 15px; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    a.btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 18px;
      border-radius: 12px;
      text-decoration: none;
      color: #e2e8f0;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-weight: 500;
      transition: all 0.2s;
    }
    a.btn:hover { background: rgba(255, 255, 255, 0.12); transform: translateY(-2px); }
    a.btn .emoji { font-size: 20px; }
    .footer { margin-top: 28px; font-size: 13px; color: #64748b; }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">S</div>
    <h1>stwytid</h1>
    <p class="tagline">Hakkımda kısa bir açıklama yaz</p>
    <div class="links">
      <a class="btn" href="https://github.com/stwytid" target="_blank">
        <span class="emoji">💻</span> GitHub
      </a>
      <a class="btn" href="LINKINIZI-BURAYA-YAZIN" target="_blank">
        <span class="emoji">📸</span> Instagram
      </a>
      <a class="btn" href="LINKINIZI-BURAYA-YAZIN" target="_blank">
        <span class="emoji">🐦</span> X (Twitter)
      </a>
      <a class="btn" href="LINKINIZI-BURAYA-YAZIN" target="_blank">
        <span class="emoji">💼</span> LinkedIn
      </a>
    </div>
    <p class="footer">stwytid.is-a.dev</p>
  </div>
</body>
</html>
